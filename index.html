<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Shardling</title>
    <meta
      name="description"
      content="Shardling, roll a small soot-orb through glowing floating ruins. Collect the shards, wake the gate, don't touch anything sharp. A 3D momentum platformer."
    />
    <meta name="theme-color" content="#0e0f1a" />
    <meta property="og:title" content="Shardling" />
    <meta
      property="og:description"
      content="A 3D momentum platformer in glowing ruins."
    />
    <meta property="og:type" content="website" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
